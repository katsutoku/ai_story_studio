{% extends "base.html" %}
{% block title %}修正結果の確認 - 第{{ chapter.chapter_number }}章{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('projects.detail', project_id=project.id) }}">{{ project.title }}</a></li>
    <li class="breadcrumb-item"><a href="{{ url_for('chapters.list_chapters', project_id=project.id) }}">章管理</a></li>
    <li class="breadcrumb-item active">修正結果の確認</li>
  </ol>
</nav>

<h1 class="h3 mb-3">修正結果の確認</h1>
<p class="text-muted">
  まだファイルには保存されていません。内容を見比べて、修正後の本文を編集してから保存することもできます。
</p>

<div class="row g-3 mb-4">
  <div class="col-md-6">
    <div class="card h-100">
      <div class="card-header">修正前</div>
      <div class="card-body">
        <pre class="mb-0" style="white-space: pre-wrap; max-height: 500px; overflow-y: auto;">{{ existing_content }}</pre>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card h-100 border-success">
      <div class="card-header bg-success-subtle">修正後（編集可能）</div>
      <div class="card-body">
        <form method="post" action="{{ url_for('chapters.revise_confirm', project_id=project.id, chapter_id=chapter.id) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <textarea name="revised_content" class="form-control markdown-editor" rows="20">{{ revised_content }}</textarea>
          <div class="mt-3">
            <button type="submit" class="btn btn-primary">この内容で保存する</button>
            <a href="{{ url_for('chapters.revise', project_id=project.id, chapter_id=chapter.id) }}" class="btn btn-outline-secondary">やり直す</a>
            <a href="{{ url_for('chapters.list_chapters', project_id=project.id) }}" class="btn btn-outline-secondary">破棄してキャンセル</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
